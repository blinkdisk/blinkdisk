name: Check SimplySign installation

on:
  pull_request:
    paths:
      - ".github/scripts/install-simplysign.ps1"
      - ".github/workflows/deploy-desktop.yml"
      - ".github/workflows/simplysign.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install latest SimplySign Desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "./.github/scripts/install-simplysign.ps1"
        shell: bash
